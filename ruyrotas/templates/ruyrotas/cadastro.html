{% extends 'ruyrotas/base.html' %}
{% block navbar %}{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center my-3">
  <div class="card bg-dark text-white p-3 rounded-4 shadow" style="max-width: 360px; width: 100%;">
    
    <h3 class="text-center fw-bold mb-3 fs-3">Cadastro</h3>

    <form method="POST" enctype="multipart/form-data" class="d-flex flex-column gap-2">
      {% csrf_token %}

      <div class="d-flex flex-column text-start">
        <label for="nome" class="form-label small fw-semibold text-white mb-1">Nome:</label>
        <input type="text" id="nome" name="nome" class="form-control form-control-sm" required />
      </div>

      <div class="d-flex flex-column text-start">
        <label for="email" class="form-label small fw-semibold text-white mb-1">E-mail:</label>
        <input type="email" id="email" name="email" class="form-control form-control-sm" required />
      </div>

      <div class="d-flex flex-column text-start">
        <label for="comprovante" class="form-label small fw-semibold text-white mb-1">Comprovante de matrícula:</label>
        <input type="file" id="comprovante" name="comprovante" class="form-control form-control-sm" accept=".pdf,image/*" required />
      </div>

      <div class="d-flex flex-column text-start">
        <label for="senha" class="form-label small fw-semibold text-white mb-1">Senha:</label>
        <input type="password" id="senha" name="senha" class="form-control form-control-sm" required />
      </div>

      <div class="d-flex flex-column text-start">
        <label for="confirmacao_senha" class="form-label small fw-semibold text-white mb-1">Confirmação de senha:</label>
        <input type="password" id="confirmacao_senha" name="confirmacao_senha" class="form-control form-control-sm" required />
      </div>

      <button type="submit" class="btn btn-primary rounded-pill fw-bold py-2 fs-6 mt-2 w-100">
        Cadastrar
      </button>
    </form>

  <div class="text-center mt-3 text-white small">
    Já tem uma conta? <a href="{% url 'login' %}" class="text-white text-decoration-underline fw-semibold">faça login aqui</a>
  </div>

  </div>
</div>
{% endblock %}
