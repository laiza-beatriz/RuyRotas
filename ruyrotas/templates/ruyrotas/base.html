{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RuyRotas{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">/
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'style/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>

    <header class="navbar navbar-expand navbar-dark navbar-custom fixed-top">
    <!-- Troque container-fluid px-2 por container -->
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4 text-white" href="{% url 'index' %}">
            <img src="{% static 'img/logo.png' %}" alt="Logo RuyRotas">
            <span>RuyRotas</span>
        </a>

        <ul class="navbar-nav mx-auto d-flex align-items-center gap-4 fs-5">
            <li class="nav-item">
                <a class="nav-link nav-link-custom active" href="{% url 'index' %}">Linhas</a>
            </li>
            <li class="nav-item">
                <a class="nav-link nav-link-custom" href="#">Chat</a>
            </li>
        </ul>

        <div class="d-flex align-items-center gap-2 user-section fs-5">
            <i class="fa-solid fa-circle-user fs-3"></i>
            <span>usuario</span>
            <i class="fa-solid fa-gear ms-1" style="cursor: pointer;"></i>
        </div>
    </div>
</header>
    <main class="main-content pt-5 mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
